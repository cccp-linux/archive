name: Build binary package

on:
  workflow_call:
    inputs:
      path: { type: string }
  workflow_dispatch:
    inputs:
      path: { type: string }

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        suite: ["sid", "trixie", "stonking", "resolute", "noble"]
        arch: ["amd64", "arm64", "armhf"]
    continue-on-error: true
    runs-on: ${{ startsWith(matrix.arch, 'arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: master

      - name: Install sbuild tools
        run: |
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends debian-archive-keyring ubuntu-keyring \
            arch-test distro-info-data gpg mmdebstrap qemu-user-static sbuild wget

      - name: Cache chroot
        id: cache-chroot
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sbuild/${{ matrix.suite }}-${{ matrix.arch }}.tar
          key: chroot-${{ matrix.suite }}-${{ matrix.arch }}

      - name: Create chroot
        if: steps.cache-chroot.outputs.cache-hit != 'true'
        run: |
          suite=${{ matrix.suite }}
          arch=${{ matrix.arch }}

          mkdir -p ~/.cache/sbuild
          chroot=~/.cache/sbuild/${suite}-${arch}.tar

          ubuntu-distro-info --all | grep -qx $suite && comp=main,universe || comp=main
          mmdebstrap -v --variant=buildd --include=aptitude,ca-certificates --architectures=$arch --components=$comp \
            --customize-hook="
          cat cccp-linux-keyring.asc | gpg --dearmor     > \$1/etc/apt/keyrings/cccp-linux-keyring.gpg
          cat cccp-linux.sources | sed s/%suite%/$suite/ > \$1/etc/apt/sources.list.d/cccp-linux.sources
            " $suite $chroot

      - name: Build package
        id: build
        run: |
          suite=${{ matrix.suite }}
          arch=${{ matrix.arch }}
          path=${{ inputs.path }}

          case $suite in
            trixie)   append="~deb13" ;;
            noble)    append="~ubuntu24.04" ;;
            resolute) append="~ubuntu26.04" ;;
            stonking) append="~ubuntu26.10" ;;
            *)        append="" ;;
          esac
          [ -z "$append" ] || append=--append-to-version="$append" 
          [ "$arch" = "amd64" ] && arch_all=--arch-all || arch_all=--no-arch-all

          fetch=${path%.dsc}.fetch
          if [ -x $fetch ]; then $fetch; fi

          mkdir /tmp/build
          sbuild -v --chroot-mode=unshare --arch=$arch -d $suite $arch_all $append --build-dep-resolver=aptitude \
            --maintainer="CCCP Linux <cccp-linux@users.noreply.github.com>" \
            --build-dir=/tmp/build $path

          echo "name=$(basename $path .dsc)" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.name }}-${{ matrix.suite }}-${{ matrix.arch }}
          overwrite: 'true'
          path: |
            /tmp/build/*.deb
            !/tmp/build/*dbgsym*.deb

  collect:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: master

      - name: Obtain package details
        id: pkg
        run: |
          echo "name=$(basename ${{ inputs.path }} .dsc)" >> $GITHUB_OUTPUT
          echo "pool=$(dirname ${{ inputs.path }})" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/build
          pattern: ${{ steps.pkg.outputs.name }}-*

      - name: Collect artifacts
        run: |
          name=${{ steps.pkg.outputs.name }}
          pool=${{ steps.pkg.outputs.pool }}

          for dir in /tmp/build/$name-*; do
            suite=${dir%-*} suite=${suite##*-}
            mkdir -p $pool/$suite
            cp -u $dir/* $pool/$suite/
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $pool
          git commit -m "Add $name build artifacts"
          git push origin master
